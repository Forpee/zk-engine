[package]
name = "jolt-crypto"
version = "0.1.0"
authors = ["Jolt Contributors"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/a16z/jolt"
description = "Backend-agnostic cryptographic group and commitment primitives for Jolt"
keywords = [
  "cryptography",
  "zero-knowledge",
  "commitment",
  "elliptic-curve",
  "zkvm",
]
categories = ["cryptography"]

[lints]
workspace = true

[features]
default = ["parallel"]
parallel = ["dep:rayon", "jolt-poly/parallel"]

[dependencies]
jolt-field = { path = "../jolt-field" }
jolt-poly = { path = "../jolt-poly" }
jolt-transcript = { path = "../jolt-transcript" }
serde = { workspace = true, features = ["derive", "alloc"] }
rand_core = { workspace = true }

ark-bn254 = { workspace = true, features = ["curve"] }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true }
num-bigint = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
ark-std = { workspace = true }
rand_chacha = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
bincode = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "crypto"
harness = false
