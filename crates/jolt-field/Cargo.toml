[package]
name = "jolt-field"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Shared field abstractions over the BN254 scalar field"
repository = "https://github.com/a16z/jolt"
keywords = ["SNARK", "cryptography", "finite-fields", "BN254"]
categories = ["cryptography"]

[lints]
workspace = true

[dependencies]
ark-ff = { workspace = true }
ark-serialize = { workspace = true }
ark-bn254 = { workspace = true, features = ["curve"] }
num-traits = { workspace = true }
serde = { workspace = true, features = ["derive"] }
allocative = { workspace = true, optional = true }
rand_core = { workspace = true }
thiserror = { workspace = true }

[features]
allocative = ["dep:allocative"]

[dev-dependencies]
bincode = { workspace = true }
num-bigint = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
