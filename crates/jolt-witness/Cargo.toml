[package]
name = "jolt-witness"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Trace-to-witness transformation for the Jolt WebAssembly zkVM"
repository = "https://github.com/a16z/jolt"

[lints]
workspace = true

[features]
default = []
test-utils = []
parallel = ["dep:rayon", "jolt-utils/parallel"]
# Inert: the RV64 field-inline witnesses are gone; dependents' feature lists
# keep resolving until the RISC-V crates are deleted.
field-inline = []

[dependencies]
jolt-claims.workspace = true
jolt-witness-derive.workspace = true
jolt-field.workspace = true
jolt-utils.workspace = true
jolt-wasm-backend = { workspace = true }
jolt-wasm-ir = { workspace = true }
jolt-wasm-program = { workspace = true }
jolt-wasm-tables = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
jolt-field = { workspace = true, features = ["bn254"] }
