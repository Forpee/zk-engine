[package]
name = "jolt-prover"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Modular prover for the Jolt zkVM"
repository = "https://github.com/a16z/jolt"
keywords = ["SNARK", "zkvm", "prover"]
categories = ["cryptography"]

[lints]
workspace = true

[features]
default = ["parallel"]
parallel = ["jolt-kernels/parallel", "dep:rayon"]
# Compile-time ZK mode: committed sumcheck recorders, hiding witness
# commitments and stage-8 opening, and the BlindFold tail. One compiled
# prover produces exactly one protocol — there is no runtime mode flag.
zk = [
  "jolt-verifier/zk",
  "jolt-kernels/zk",
  "dep:jolt-blindfold",
  "dep:rand_core",
]
# The profile harness (`[[bin]] jolt-prover`, `profile` subcommand): the
# WAT workloads through the WASM frontend/backend plus the jolt-profiling
# subscriber stack (chrome trace + summary.json + monitor counters).
profiling = [
  "dep:bincode",
  "dep:chrono",
  "dep:clap",
  "dep:jolt-dory",
  "dep:jolt-profiling",
  "jolt-profiling/monitor",
  "jolt-profiling/summary",
  "dep:jolt-wasm-frontend",
  "dep:wat",
]
# Per-batch heap snapshots from the profile harness: emitted inside
# `prove()` after each stage (inert unless the harness sets a prefix),
# visiting the stage clear-output carriers and the proof session.
allocative = [
  "dep:allocative",
  "dep:jolt-profiling",
  "jolt-field/allocative",
  "jolt-kernels/allocative",
  "jolt-profiling/allocative",
  "jolt-verifier/allocative",
]

[dependencies]
jolt-blindfold = { workspace = true, optional = true }
jolt-claims.workspace = true
jolt-crypto.workspace = true
jolt-field.workspace = true
jolt-kernels.workspace = true
jolt-openings.workspace = true
jolt-poly.workspace = true
jolt-sumcheck.workspace = true
jolt-transcript.workspace = true
jolt-verifier.workspace = true
jolt-witness.workspace = true
jolt-wasm-backend.workspace = true
jolt-wasm-frontend = { workspace = true, optional = true }
jolt-wasm-ir.workspace = true
jolt-wasm-program.workspace = true
jolt-wasm-tables.workspace = true
wat = { workspace = true, optional = true }
rand_core = { workspace = true, features = ["getrandom"], optional = true }
rayon = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

# Optional: the `profiling` harness (bins cannot use dev-dependencies).
allocative = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
jolt-dory = { workspace = true, optional = true }
# The workspace entry disables `summary`: the `profiling` feature adds it
# explicitly; `allocative` needs only the flamegraph hooks.
jolt-profiling = { workspace = true, optional = true }

[dev-dependencies]
bincode.workspace = true
blst.workspace = true
jolt-dory.workspace = true
jolt-wasm-frontend.workspace = true
# Subscriber stack for tests; the profiling smoke test's summary usage
# arrives via the `profiling` feature's `jolt-profiling/summary`.
jolt-profiling.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
wat.workspace = true

[[bin]]
name = "jolt-prover"
path = "src/bin/jolt_prover.rs"
required-features = ["profiling"]
