[package]
name = "jolt-claims"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared claim and expression types for Jolt protocols"

[lints]
workspace = true

[features]
default = []
# Inert: the lattice and field-inline protocols were RV64-only and are gone;
# the features remain so dependents' feature lists keep resolving until the
# RISC-V crates are deleted.
# Heap flamegraph visitation of the relation claim structs (profile harness).
allocative = ["dep:allocative"]
test-utils = []

[dependencies]
allocative = { workspace = true, optional = true }
blake2.workspace = true
derive_more.workspace = true
jolt-claims-derive.workspace = true
jolt-field.workspace = true
jolt-lookup-tables.workspace = true
jolt-poly.workspace = true
jolt-openings.workspace = true
jolt-wasm-ir = { workspace = true, features = ["serialization"] }
jolt-wasm-tables = { workspace = true }
jolt-utils.workspace = true
serde = { workspace = true, features = ["alloc", "derive"] }
thiserror.workspace = true
