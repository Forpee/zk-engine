[package]
name = "jolt-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Standalone verifier model crate for Jolt proofs"
repository = "https://github.com/a16z/jolt"
keywords = ["SNARK", "zkvm", "verifier"]
categories = ["cryptography"]

[lints]
workspace = true

[features]
default = ["transcript-blake2b"]
# Heap flamegraph visitation of the stage clear-output carriers (profile
# harness's per-stage SVGs).
allocative = ["dep:allocative", "jolt-claims/allocative"]
fs-audit = []
zk = []
transcript-blake2b = []
transcript-keccak = []
transcript-poseidon = []

[dependencies]
allocative = { workspace = true, optional = true }
ark-serialize.workspace = true
jolt-blindfold.workspace = true
jolt-claims.workspace = true
jolt-claims-derive.workspace = true
jolt-crypto.workspace = true
jolt-field.workspace = true
jolt-openings.workspace = true
jolt-poly.workspace = true
jolt-r1cs.workspace = true
jolt-sumcheck.workspace = true
jolt-transcript.workspace = true
jolt-utils.workspace = true
jolt-verifier-derive.workspace = true
jolt-wasm-ir = { workspace = true, features = ["serialization"] }
jolt-wasm-program = { workspace = true, features = ["serialization"] }
jolt-wasm-tables.workspace = true
num-traits.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
quote.workspace = true
syn = { workspace = true, features = ["visit"] }
