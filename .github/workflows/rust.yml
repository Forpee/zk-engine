name: Build and Test Jolt

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**", main]
    paths-ignore:
      - "specs/**"
      - "*.md"
      - ".claude/**"

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      - name: cargo fmt
        run: cargo fmt --all --check

  taplo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli
      - name: taplo fmt --check
        run: taplo fmt --check

  style:
    runs-on: ubuntu-latest
    steps:
      # Full history (blobs lazily fetched) so the diff-scoped rules can
      # resolve an exact merge base; see scripts/check_style_invariants.py.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: check style invariants
        run: python3 scripts/check_style_invariants.py --base "origin/${{ github.base_ref || 'main' }}"

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # One compiled prover/verifier proves exactly one protocol: lint the
      # ZK build and the profiling harness separately.
      - name: cargo clippy (zk, profiling, allocative)
        run: >
          cargo clippy -p jolt-verifier -p jolt-kernels -p jolt-prover --all-targets
          --features jolt-prover/zk,jolt-prover/profiling,jolt-prover/allocative -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest run (workspace)
        run: cargo nextest run --workspace --cargo-profile ci

  test-zk:
    name: WASM end-to-end (zk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: BlindFold end-to-end
        run: cargo nextest run -p jolt-prover --features zk --cargo-profile ci -E 'binary(wasm_e2e)'
      - name: Profiling harness smoke
        run: cargo nextest run -p jolt-prover --features profiling --cargo-profile ci -E 'binary(profiling_smoke)'
